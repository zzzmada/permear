# configuration_example.yaml — PERMEAR integration template
#
# This file shows what to ADD to your existing configuration.yaml to
# integrate PERMEAR. Do NOT replace your entire config with this file —
# merge the relevant sections into your own configuration.yaml.
#
# Required additions (copy into your configuration.yaml):

# 1. PERMEAR package — loads shell_commands, sensors, and input entities.
#    Note: permear.yaml (providers, aras, cycles) does NOT need to be included
#    here — it is read directly by the Python scripts and exposed via
#    sensor.permear_config. Only the package below must be loaded by HA.
homeassistant:
  packages: !include_dir_named packages/

# 2. Automations — if not already present in your config
automation: !include_dir_merge_list automations/

# ---------------------------------------------------------------------------
# Optional: input_boolean entities used by household automations.
# Add these only if you use PERMEAR's window-alert or similar household hooks.
# ---------------------------------------------------------------------------
# input_boolean:
#   permear_window_alert_sent:
#     name: "Window alert sent"
#     icon: mdi:window-open

# ---------------------------------------------------------------------------
# That's it. Everything else in PERMEAR lives in:
#   packages/permear.yaml  — shell_commands, sensors, input entities
#   automations/           — automation files (cycles, telegram, events, etc.)
#   scripts/               — Python scripts
#   permear.yaml           — your AI provider configuration
# ---------------------------------------------------------------------------
