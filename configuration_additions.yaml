    name: PERMEAR last agent message
    max: 255
    initial: ""
  permear_pending_auto_spec:
    name: PERMEAR pending automation flag
    max: 30
    initial: ""

# -----------------------------------------------------------------------------
# Sensors — expose memory and health via state attributes
# -----------------------------------------------------------------------------
sensor:
  # Health sensor (4 states: all_ok, recovering, fallback_active, degraded)
  - platform: command_line
    name: PERMEAR Health
    command: 'python3 /config/scripts/sensor_permear_health.py'
    value_template: "{{ value_json.state }}"
    scan_interval: 60
    json_attributes:
      - summary
      - retries_recovered_today
      - final_failures_today
      - circuit_status
      - active_silenced_errors
      - last_failure_at
      - last_success_at
      - fallbacks_secondary_today
      - last_fallback_at

  # Current day memory
  - platform: command_line
    name: current_day_memory
    command: 'python3 /config/scripts/sensor_current_day.py'
    value_template: "{{ value_json.date | default('') }}"
    scan_interval: 300
    json_attributes:
      - events
      - interactions
      - daily_memories
      - briefing_sent
      - bulletin_triggered

  # Perennial memory (soul, users, insights)
  - platform: command_line
    name: perennial_memory
    command: 'python3 /config/scripts/sensor_perennial.py'
    value_template: "loaded"
    scan_interval: 600
    json_attributes:
      - soul
      - users
      - insights

  # Per-day historic memories — generate one per weekday (Mon-Sun)
  # for use in weekly compilation templates.
  - platform: command_line
    name: monday_memory
    command: 'cat /config/memory/daily/monday.json 2>/dev/null || echo "{}"'
    value_template: "{{ value_json.date | default('') }}"
    scan_interval: 3600
    json_attributes: [events, interactions, daily_memories]

  - platform: command_line
    name: tuesday_memory
    command: 'cat /config/memory/daily/tuesday.json 2>/dev/null || echo "{}"'
