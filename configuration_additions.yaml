    scan_interval: 3600
    json_attributes: [events, interactions, daily_memories]

  - platform: command_line
    name: wednesday_memory
    command: 'cat /config/memory/daily/wednesday.json 2>/dev/null || echo "{}"'
    value_template: "{{ value_json.date | default('') }}"
    scan_interval: 3600
    json_attributes: [events, interactions, daily_memories]

  - platform: command_line
    name: thursday_memory
    command: 'cat /config/memory/daily/thursday.json 2>/dev/null || echo "{}"'
    value_template: "{{ value_json.date | default('') }}"
    scan_interval: 3600
    json_attributes: [events, interactions, daily_memories]

  - platform: command_line
    name: friday_memory
    command: 'cat /config/memory/daily/friday.json 2>/dev/null || echo "{}"'
    value_template: "{{ value_json.date | default('') }}"
