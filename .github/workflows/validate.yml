name: Validate

# Validates the integration on every push/PR (and once a day, so upstream
# rule changes surface without a commit). These run in the PUBLISHED HACS repo,
# whose only custom_components entry is permear — hassfest scans every
# custom_components/*/manifest.json it finds.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest (manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS (repository structure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
