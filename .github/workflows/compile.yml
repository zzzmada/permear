name: Compile

# Byte-compiles the component on a current Python (the dev box only has 3.6;
# CI runs the version HA actually targets), catching syntax errors that
# hassfest/HACS structural checks would not. Not a test suite — that lands in
# v9.1.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: Byte-compile the component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: compileall
        run: python -m compileall -f -q custom_components/permear
