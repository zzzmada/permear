# -----------------------------------------------------------------------------
# 8. DAILY RESET (midnight)
# Emits an event other automations can hook into.
# -----------------------------------------------------------------------------
- alias: "PERMEAR - Daily reset"
  id: permear_daily_reset
  mode: single
  trigger:
    - platform: time
      at: "00:00:00"
  action:
    - event: permear_day_reset

# -----------------------------------------------------------------------------
# 9. REAL-TIME ERROR MONITOR
# Listens to HA system_log events, filters noise, classifies SELF/HA errors.
# Sends Telegram alert with "Silence 24h" button for genuine errors.
# -----------------------------------------------------------------------------
- alias: "PERMEAR - Realtime error monitor"
  id: permear_realtime_error_monitor
  mode: queued
  max: 10
  trigger:
    - platform: event
      event_type: system_log_event
      event_data:
        level: ERROR
  action:
    - service: shell_command.process_log_event
      data:
        component: "{{ trigger.event.data.name | default('unknown') }}"
        message: "{{ trigger.event.data.message[0] | default('') | string }}"
      response_variable: result
    - variables:
        parsed: "{{ result.stdout | default('{}') | from_json | default({}, true) }}"
    - condition: template
      value_template: "{{ not parsed.silenced | default(true) }}"
    - service: telegram_bot.send_message
      data:
        chat_id: !secret permear_chat_id
        message: "{{ parsed.message | default('Error detected') }}"
        parse_mode: plain_text
        inline_keyboard:
          - "Silence 24h:perr_archive_{{ parsed.hash }}"

# -----------------------------------------------------------------------------
# 10. CLEANUP ARCHIVED ERRORS (every 6h)
# Removes expired silenced-24h entries.
# -----------------------------------------------------------------------------
- alias: "PERMEAR - Cleanup archived errors"
  id: permear_cleanup_archived
  mode: single
  trigger:
    - platform: time_pattern
      hours: "/6"
  action:
    - service: shell_command.cleanup_archived_errors

# -----------------------------------------------------------------------------
# 11. NEW AUTOMATION TRIGGER
# Detects /new_automation or keywords in Telegram, sets state to "awaiting_new".
# -----------------------------------------------------------------------------
- alias: "PERMEAR - New automation trigger"
  id: permear_new_automation_trigger
  mode: single
  trigger:
    - platform: event
      event_type: telegram_text
      event_data:
        chat_id: !secret permear_chat_id
  condition:
    - condition: template
      value_template: >
        {% set text = trigger.event.data.text | lower %}
        {{ text.startswith('/new_automation')
           or text.startswith('/nova_automacao')
           or 'create an automation' in text
           or 'create automation' in text }}
  action:
    - service: input_text.set_value
      target:
        entity_id: input_text.permear_pending_auto_spec
      data:
        value: "awaiting_new"
    - service: telegram_bot.send_message
      data:
        chat_id: !secret permear_chat_id
        message: "Describe the automation you want. Example: 'turn on the kitchen light at 7pm every day'."
        parse_mode: plain_text

# -----------------------------------------------------------------------------
# 12. AUTOMATION CREATION FLOW (via ai_task structured output)
# When user describes an automation (after /new_automation), parse via ai_task
# and present preview card with [Create] [Adjust] [Discard] buttons.
# -----------------------------------------------------------------------------
- alias: "PERMEAR - Automation creation flow"
  id: permear_automation_creation_flow
  mode: queued
  max: 3
  trigger:
    - platform: event
      event_type: telegram_text
      event_data:
        chat_id: !secret permear_chat_id
  condition:
    - condition: template
      value_template: >
        {{ states('input_text.permear_pending_auto_spec') in ['awaiting_new', 'awaiting_edit']
           and not trigger.event.data.text.startswith('/') }}
  action:
    - service: shell_command.monitored_entities_text
      response_variable: entities_result
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {% set last_fb = state_attr('sensor.permear_health', 'last_fallback_at') %}
                {% if last_fb %}
                  {{ (now() - (last_fb | as_datetime)).total_seconds() < 3600 }}
                {% else %}
                  false
                {% endif %}
          sequence:
            - service: shell_command.agent_log_fallback
              continue_on_error: true
            - service: ai_task.generate_data
              data:
                task_name: "Parse automation request [skip-primary]"
                entity_id: ai_task.google_ai_task
                instructions: |
                  Parse the user's automation request into structured fields.

                  User request: "{{ trigger.event.data.text }}"

                  Available entities (use these exact IDs):
                  {{ entities_result.stdout | default('No entities available') }}

                  Return:
                  - alias: short descriptive name
                  - trigger_type: "time" or "state" or "numeric_state"
                  - trigger_config: JSON config (e.g. {"at": "19:00:00"} or {"entity_id": "binary_sensor.x", "to": "on"})
                  - action_service: HA service to call (e.g. light.turn_on)
                  - action_entity: target entity_id
                structure:
                  alias:
                    required: true
                    selector: { text: {} }
                  trigger_type:
                    required: true
                    selector: { text: {} }
                  trigger_config:
                    required: true
                    selector: { text: { multiline: true } }
                  action_service:
                    required: true
                    selector: { text: {} }
                  action_entity:
                    required: true
                    selector: { text: {} }
              response_variable: auto_response
              continue_on_error: true
      default:
        - service: ai_task.generate_data
          data:
            task_name: "Parse automation request"
            entity_id: ai_task.openrouter_deepseek_v3
            instructions: |
              Parse the user's automation request into structured fields.

              User request: "{{ trigger.event.data.text }}"

              Available entities (use these exact IDs):
              {{ entities_result.stdout | default('No entities available') }}

              Return:
              - alias: short descriptive name
              - trigger_type: "time" or "state" or "numeric_state"
              - trigger_config: JSON config (e.g. {"at": "19:00:00"} or {"entity_id": "binary_sensor.x", "to": "on"})
              - action_service: HA service to call (e.g. light.turn_on)
              - action_entity: target entity_id
            structure:
              alias:
                required: true
                selector: { text: {} }
              trigger_type:
                required: true
                selector: { text: {} }
              trigger_config:
                required: true
                selector: { text: { multiline: true } }
              action_service:
                required: true
                selector: { text: {} }
              action_entity:
                required: true
                selector: { text: {} }
          response_variable: auto_response
          continue_on_error: true
        - if:
            - condition: template
              value_template: >
                {{ auto_response is not defined
                   or auto_response.data is none
                   or auto_response.data | length == 0 }}
          then:
            - service: shell_command.agent_log_fallback
              continue_on_error: true
            - service: ai_task.generate_data
              data:
                task_name: "Parse automation request [fallback]"
                entity_id: ai_task.google_ai_task
                instructions: |
                  Parse the user's automation request into structured fields.

                  User request: "{{ trigger.event.data.text }}"

                  Available entities (use these exact IDs):
                  {{ entities_result.stdout | default('No entities available') }}

                  Return:
                  - alias: short descriptive name
                  - trigger_type: "time" or "state" or "numeric_state"
                  - trigger_config: JSON config (e.g. {"at": "19:00:00"} or {"entity_id": "binary_sensor.x", "to": "on"})
                  - action_service: HA service to call (e.g. light.turn_on)
                  - action_entity: target entity_id
                structure:
                  alias:
                    required: true
                    selector: { text: {} }
                  trigger_type:
                    required: true
                    selector: { text: {} }
                  trigger_config:
                    required: true
                    selector: { text: { multiline: true } }
                  action_service:
                    required: true
                    selector: { text: {} }
                  action_entity:
                    required: true
                    selector: { text: {} }
              response_variable: auto_response
              continue_on_error: true
    - if:
        - condition: template
          value_template: "{{ auto_response is not defined or auto_response.data is none }}"
      then:
        - service: telegram_bot.send_message
          data:
            chat_id: !secret permear_chat_id
            message: "Sorry, couldn't parse your request. Try again."
            parse_mode: plain_text
        - stop: "Parse failed"

    # Write raw spec to file (avoids 255-char input_text limit)
    - service: shell_command.write_pending_auto_spec
      data:
        spec: "{{ auto_response.data | tojson }}"
    - service: shell_command.build_automation_spec
      response_variable: spec_result
    - service: input_text.set_value
      target:
        entity_id: input_text.permear_pending_auto_spec
      data:
        value: "pending"

    # Show preview card
    - service: telegram_bot.send_message
      data:
        chat_id: !secret permear_chat_id
        message: |
          Preview:
          Name: {{ auto_response.data.alias }}
          Trigger: {{ auto_response.data.trigger_type }} - {{ auto_response.data.trigger_config }}
          Action: {{ auto_response.data.action_service }} on {{ auto_response.data.action_entity }}

          Confirm?
        parse_mode: plain_text
        inline_keyboard:
          - ". Create:auto_create"
          - ". Adjust:auto_edit"
          - ". Discard:auto_discard"

# -----------------------------------------------------------------------------
# 13. LIST AUTOMATIONS COMMAND
# /list_automations or /listar_automacoes — show list with remove button per row.
# -----------------------------------------------------------------------------
- alias: "PERMEAR - List automations command"
  id: permear_list_automations_cmd
  mode: single
  trigger:
    - platform: event
      event_type: telegram_text
      event_data:
        chat_id: !secret permear_chat_id
  condition:
    - condition: template
      value_template: >
        {% set text = trigger.event.data.text | lower %}
        {{ text.startswith('/list_automations')
           or text.startswith('/listar_automacoes') }}
  action:
    - service: shell_command.agent_auto_list_json
      response_variable: list_result
    - variables:
        list_data: "{{ list_result.stdout | default('{}') | from_json | default({}, true) }}"
        autos: "{{ list_data.automations | default([]) }}"
        total: "{{ list_data.count | default(0) }}"
    - if:
        - condition: template
          value_template: "{{ total == 0 }}"
      then:
        - service: telegram_bot.send_message
          data:
            chat_id: !secret permear_chat_id
            parse_mode: plain_text
            message: "No automations created yet."
        - stop: "Empty list"
    - variables:
        list_text: >
          {% set lines = ['Automations created by agent (' ~ total ~ ')', ''] %}
          {% for a in autos[:10] %}
            {% set _ = lines.append((loop.index | string) ~ '. ' ~ a.alias) %}
          {% endfor %}
          {{ lines | join('\n') }}
        kb_rows: >
          {% set rows = [] %}
          {% for a in autos[:10] %}
            {% set _ = rows.append('Remove ' ~ (loop.index | string) ~ ':auto_remove_' ~ a.id) %}
          {% endfor %}
          {{ rows | tojson }}
    - service: telegram_bot.send_message
      data:
        chat_id: !secret permear_chat_id
        parse_mode: plain_text
        message: "{{ list_text }}"
        inline_keyboard: "{{ kb_rows | from_json }}"

# -----------------------------------------------------------------------------
# 14. CALLBACK HANDLER (Telegram button presses)
# Routes button presses to actions: create/adjust/discard, remove, silence, etc.
# -----------------------------------------------------------------------------
- alias: "PERMEAR - Callback handler"
  id: permear_callback_handler
  mode: queued
  max: 5
  trigger:
    - platform: event
      event_type: telegram_callback
      event_data:
        chat_id: !secret permear_chat_id
  action:
    - variables:
        cb_data: "{{ trigger.event.data.data | default('') }}"
        cb_id: "{{ trigger.event.data.id | default('') }}"
        msg_id: "{{ trigger.event.data.message.message_id | default(0) }}"
    - choose:
        # CREATE — confirm new automation
        - conditions:
            - condition: template
              value_template: "{{ cb_data == 'auto_create' }}"
          sequence:
            - service: shell_command.manage_agent_auto_create_from_file
              response_variable: create_result
            - service: shell_command.clear_pending_auto_spec
            - service: input_text.set_value
              target:
                entity_id: input_text.permear_pending_auto_spec
              data:
                value: ""
            - service: telegram_bot.answer_callback_query
              data:
                callback_query_id: "{{ cb_id }}"
                message: "Creating"
            - service: telegram_bot.edit_message
              data:
                chat_id: !secret permear_chat_id
                message_id: "{{ msg_id }}"
                parse_mode: plain_text
                message: "{{ create_result.stdout | default('Done.') | trim }}"

        # ADJUST — ask for changes
        - conditions:
            - condition: template
              value_template: "{{ cb_data == 'auto_edit' }}"
          sequence:
            - service: input_text.set_value
              target:
                entity_id: input_text.permear_pending_auto_spec
              data:
                value: "awaiting_edit"
            - service: telegram_bot.answer_callback_query
              data:
                callback_query_id: "{{ cb_id }}"
                message: "OK"
            - service: telegram_bot.edit_message
              data:
                chat_id: !secret permear_chat_id
                message_id: "{{ msg_id }}"
                parse_mode: plain_text
                message: "Describe what to change."

        # DISCARD — clear pending
        - conditions:
            - condition: template
              value_template: "{{ cb_data == 'auto_discard' }}"
          sequence:
            - service: shell_command.clear_pending_auto_spec
            - service: input_text.set_value
              target:
                entity_id: input_text.permear_pending_auto_spec
              data:
                value: ""
            - service: telegram_bot.answer_callback_query
              data:
                callback_query_id: "{{ cb_id }}"
                message: "Discarded"
            - service: telegram_bot.edit_message
              data:
                chat_id: !secret permear_chat_id
                message_id: "{{ msg_id }}"
                parse_mode: plain_text
                message: "Discarded."

        # REMOVE automation
        - conditions:
            - condition: template
              value_template: "{{ 'auto_remove_' in cb_data }}"
          sequence:
            - variables:
                auto_id: "{{ cb_data.split('auto_remove_')[1] }}"
            - service: shell_command.manage_agent_auto_remove
              data:
                identifier: "{{ auto_id }}"
              response_variable: remove_result
            - service: telegram_bot.answer_callback_query
              data:
                callback_query_id: "{{ cb_id }}"
                message: "Removed"
            - service: telegram_bot.edit_message
              data:
                chat_id: !secret permear_chat_id
                message_id: "{{ msg_id }}"
                parse_mode: plain_text
                message: "{{ remove_result.stdout | default('Automation removed.') | trim }}"

        # SILENCE ERROR 24h
        - conditions:
            - condition: template
              value_template: "{{ 'perr_archive_' in cb_data }}"
          sequence:
            - variables:
                err_hash: "{{ cb_data.split('perr_archive_')[1] }}"
            - service: shell_command.archive_error
              data:
                error_hash: "{{ err_hash }}"
                component: "unknown"
                message: "silenced via button"
            - service: telegram_bot.answer_callback_query
              data:
                callback_query_id: "{{ cb_id }}"
                message: "Silenced 24h"
            - service: telegram_bot.edit_message
              data:
                chat_id: !secret permear_chat_id
                message_id: "{{ msg_id }}"
                parse_mode: plain_text
                message: "Error silenced for 24h."
