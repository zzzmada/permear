                  Interactions: {{ state_attr('sensor.current_day_memory', 'interactions') | default([]) | tojson }}

                  If nothing relevant, return an empty list.
                structure:
                  memories:
                    description: "List of relevant memories (short English sentences)"
                    required: true
                    selector:
                      text:
                        multiple: true
              response_variable: memories_response
              continue_on_error: true
      default:
