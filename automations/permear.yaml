# -----------------------------------------------------------------------------
# 4. DAILY BRIEFING (off-peak 23:30)
# Generates day summary with retry/circuit/Python fallback.
# Then extracts memories via ai_task with primary + fallback provider.
# -----------------------------------------------------------------------------
- alias: "PERMEAR - Daily briefing"
  id: permear_daily_briefing
  mode: single
  trigger:
    - platform: time
      at: "23:30:00"
  action:
    # Build prompt
    - service: shell_command.ha_updates_check
      response_variable: updates_result
    - service: shell_command.build_briefing_prompt
      response_variable: prompt_result

    # Attempt 1 via conversation.process
    - service: conversation.process
      data:
        agent_id: !secret permear_agent_id
        text: "{{ prompt_result.stdout }}"
        conversation_id: "briefing_{{ now().strftime('%Y%m%d') }}"
      response_variable: briefing
      continue_on_error: true

    - variables:
        speech: "{{ briefing.response.speech.plain.speech | default('') | trim if briefing is defined else '' }}"

    # Retry if empty
    - if:
        - condition: template
          value_template: "{{ speech | length == 0 }}"
      then:
        - delay:
            seconds: 30
        - service: conversation.process
          data:
            agent_id: !secret permear_agent_id
            text: "{{ prompt_result.stdout }}"
            conversation_id: "briefing_retry_{{ now().strftime('%Y%m%d') }}"
          response_variable: briefing
          continue_on_error: true
        - variables:
            speech: "{{ briefing.response.speech.plain.speech | default('') | trim if briefing is defined else '' }}"
        - if:
            - condition: template
              value_template: "{{ speech | length > 0 }}"
          then:
            - service: shell_command.agent_log_retry_success

    # Fall back to Python briefing if still empty
    - if:
        - condition: template
          value_template: "{{ speech | length == 0 }}"
      then:
        - service: shell_command.agent_log_3fail
        - service: shell_command.briefing_simple
          response_variable: simple_result
        - variables:
            speech: "{{ simple_result.stdout | default('Briefing unavailable today.') | trim }}"

    # Send briefing
    - service: telegram_bot.send_message
      data:
        chat_id: !secret permear_chat_id
        message: "{{ speech }}"
        parse_mode: plain_text
    - service: input_text.set_value
      target:
        entity_id: input_text.permear_last_agent_message
      data:
        value: "{{ speech | truncate(255, False, '') }}"
    - service: shell_command.append_daily_flag
      data:
        detail: "briefing_sent"

    # Daily health summary (logs only if non-zero activity)
    - service: shell_command.agent_daily_summary
      response_variable: health_summary
    - if:
        - condition: template
          value_template: "{{ (health_summary.stdout | default('') | trim) | length > 0 }}"
      then:
        - service: telegram_bot.send_message
          data:
            chat_id: !secret permear_chat_id
            message: "{{ health_summary.stdout }}"
            parse_mode: plain_text

    # Extract memories via ai_task — pre-check + primary + fallback
    - delay:
        seconds: 5
    - choose:
        # If fallback used recently, skip primary
        - conditions:
            - condition: template
              value_template: >
                {% set last_fb = state_attr('sensor.permear_health', 'last_fallback_at') %}
                {% if last_fb %}
                  {{ (now() - (last_fb | as_datetime)).total_seconds() < 3600 }}
