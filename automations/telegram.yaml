# Unified Telegram callback handler (inline_keyboard buttons)
- alias: "PERMEAR - Telegram callback handler"
  id: permear_telegram_callback
  mode: queued
  max: 10
  trigger:
    - platform: event
      event_type: telegram_callback
      event_data:
        chat_id: !secret telegram_chat_id
  action:
    - variables:
        cb_data: "{{ trigger.event.data.data | default('') }}"
        msg_id: "{{ trigger.event.data.message.message_id }}"
        cb_id: "{{ trigger.event.data.id }}"
        original_msg: "{{ trigger.event.data.message.text | default('') }}"
    - choose:
        # === Silence error ===
        - conditions:
            - condition: template
              value_template: "{{ 'Silenciar' in cb_data }}"
          sequence:
            - variables:
                err_hash: "{{ original_msg.split('[id:')[1].split(']')[0] if '[id:' in original_msg else '' }}"
            - condition: template
              value_template: "{{ err_hash | length > 0 }}"
            - action: shell_command.archive_error
              data:
                error_hash: "{{ err_hash }}"
                component: "auto"
                message: "{{ original_msg | replace(\"'\", '') | truncate(80, False, '') }}"
            - action: telegram_bot.answer_callback_query
              data:
                callback_query_id: "{{ cb_id }}"
                message: "Silenciado por 24h"
            - action: telegram_bot.edit_message
              data:
                chat_id: !secret telegram_chat_id
                message_id: "{{ msg_id }}"
                message: "{{ original_msg }}\n[silenciado 24h]"
                parse_mode: plain_text

        # === Update ===
        - conditions:
            - condition: template
              value_template: "{{ 'Atualizar' in cb_data }}"
          sequence:
            - variables:
                entity: "{{ original_msg.split('[entity:')[1].split(']')[0] if '[entity:' in original_msg else '' }}"
            - condition: template
              value_template: "{{ entity | length > 0 }}"
            - action: telegram_bot.answer_callback_query
              data:
                callback_query_id: "{{ cb_id }}"
                message: "Iniciando atualização..."
            - action: shell_command.ha_update_check_backup
              response_variable: backup_check
            - action: shell_command.ha_update_execute
              data:
                entity_id: "{{ entity }}"
              response_variable: exec_result
            - action: telegram_bot.edit_message
              data:
                chat_id: !secret telegram_chat_id
                message_id: "{{ msg_id }}"
                parse_mode: plain_text
                message: >
                  {{ original_msg }}

                  [INICIADO]
                  {{ exec_result.stdout | default('') | trim }}

        # === Ignore update ===
        - conditions:
            - condition: template
              value_template: "{{ 'Ignorar' in cb_data }}"
          sequence:
            - variables:
                entity: "{{ original_msg.split('[entity:')[1].split(']')[0] if '[entity:' in original_msg else '' }}"
            - condition: template
              value_template: "{{ entity | length > 0 }}"
            - action: shell_command.ha_update_skip
              data:
                entity_id: "{{ entity }}"
              response_variable: skip_result
            - action: telegram_bot.answer_callback_query
              data:
                callback_query_id: "{{ cb_id }}"
                message: "Ignorado ate nova versao"
            - action: telegram_bot.edit_message
              data:
                chat_id: !secret telegram_chat_id
                message_id: "{{ msg_id }}"
                parse_mode: plain_text
                message: "{{ original_msg }}\n[ignorado]"

        # === cnew_ — Confirm and create automation ===
        - conditions:
            - condition: template
              value_template: "{{ 'cnew_' in cb_data }}"
          sequence:
            - action: telegram_bot.answer_callback_query
              data:
                callback_query_id: "{{ cb_id }}"
                message: "Criando..."
            - action: shell_command.manage_agent_auto_create_from_file
              response_variable: create_result
            - action: input_text.set_value
              target:
                entity_id: input_text.permear_pending_auto_spec
              data:
                value: ""
            - action: shell_command.clear_pending_auto_spec
            - action: telegram_bot.edit_message
              data:
                chat_id: !secret telegram_chat_id
                message_id: "{{ msg_id }}"
                parse_mode: plain_text
                message: |
                  {{ original_msg }}

                  {{ create_result.stdout | default('') | trim | default('Criada.') }}

        # === cedt_ — Request adjustment ===
        - conditions:
            - condition: template
              value_template: "{{ 'cedt_' in cb_data }}"
          sequence:
            - action: telegram_bot.answer_callback_query
              data:
                callback_query_id: "{{ cb_id }}"
                message: "Aguardando ajuste..."
            - action: input_text.set_value
              target:
                entity_id: input_text.permear_pending_auto_spec
              data:
                value: "awaiting_edit"
            - action: telegram_bot.edit_message
              data:
                chat_id: !secret telegram_chat_id
                message_id: "{{ msg_id }}"
                parse_mode: plain_text
                message: |
                  {{ original_msg }}

                  Ajustar — me diga o que mudar.

        # === cdsc_ — Discard proposal ===
        - conditions:
            - condition: template
              value_template: "{{ 'cdsc_' in cb_data }}"
          sequence:
            - action: telegram_bot.answer_callback_query
              data:
                callback_query_id: "{{ cb_id }}"
                message: "Descartada"
            - action: input_text.set_value
              target:
                entity_id: input_text.permear_pending_auto_spec
              data:
                value: ""
            - action: shell_command.clear_pending_auto_spec
            - action: telegram_bot.edit_message
              data:
                chat_id: !secret telegram_chat_id
                message_id: "{{ msg_id }}"
                parse_mode: plain_text
                message: |
                  {{ original_msg }}

                  Descartada.

        # === drmv_confirm_ — Confirm and execute removal ===
        - conditions:
            - condition: template
              value_template: "{{ 'drmv_confirm_' in cb_data }}"
          sequence:
            - variables:
                auto_id: "{{ cb_data.split('drmv_confirm_')[1] }}"
            - action: shell_command.manage_agent_auto_remove
              data:
                identifier: "{{ auto_id }}"
              response_variable: remove_result
            - action: telegram_bot.answer_callback_query
              data:
                callback_query_id: "{{ cb_id }}"
                message: "Removida"
            - action: telegram_bot.edit_message
              data:
                chat_id: !secret telegram_chat_id
                message_id: "{{ msg_id }}"
                parse_mode: plain_text
                message: "{{ remove_result.stdout | default('') | trim | default('Automacao removida.') }}"

        # === prio_set_ — Set priority for sensitive entity ===
        - conditions:
            - condition: template
              value_template: "{{ cb_data.startswith('/prio_set_') }}"
          sequence:
            - variables:
                prio_payload: "{{ cb_data.replace('/prio_set_', '') }}"
                prio_nivel: "{{ prio_payload.split('_')[0] }}"
                prio_entity: "{{ prio_payload.split('_', 1)[1] }}"
            - action: shell_command.set_entity_priority
              data:
                entity_id: "{{ prio_entity }}"
                priority: "{{ prio_nivel }}"
              response_variable: prio_result
            - action: telegram_bot.answer_callback_query
              data:
                callback_query_id: "{{ cb_id }}"
                message: "Prioridade definida"
            - action: telegram_bot.edit_message
              data:
                chat_id: !secret telegram_chat_id
                message_id: "{{ msg_id }}"
                parse_mode: plain_text
                message: >
                  {{ original_msg }}

                  Prioridade definida: nivel {{ prio_nivel }}.
                  {% if prio_nivel | int == 2 %}Você será avisado sempre que este sensor disparar.
                  {% elif prio_nivel | int == 1 %}Você será avisado só em situações anormais.
                  {% else %}Sensor ignorado nos alertas.{% endif %}

      default:
        - action: telegram_bot.answer_callback_query
          data:
            callback_query_id: "{{ cb_id }}"
            message: "DEBUG cb={{ cb_data }}"

# List agent automations with Card 2 (clickable remove buttons)
- alias: "PERMEAR - List agent automations"
  id: permear_list_automations
  mode: queued
  max: 3
  trigger:
    - platform: event
      event_type: telegram_command
      event_data:
        command: "/listar_automacoes"
        chat_id: !secret telegram_chat_id
    - platform: event
      event_type: telegram_text
      event_data:
        chat_id: !secret telegram_chat_id
  condition:
    - condition: template
      value_template: >
        {% if trigger.event.event_type == 'telegram_command' %}
          true
        {% else %}
          {% set text = trigger.event.data.text | lower %}
          {{ 'listar automacao' in text or 'minhas automacoes' in text
             or 'listar automações' in text or 'minhas automações' in text }}
        {% endif %}
  action:
    - action: shell_command.agent_auto_list_json
      response_variable: list_result
    - variables:
        list_data: "{{ list_result.stdout | default('{}') | from_json | default({}, true) }}"
        autos: "{{ list_data.automations | default([]) }}"
        total: "{{ list_data.count | default(0) }}"
    - if:
        - condition: template
          value_template: "{{ total == 0 }}"
      then:
        - action: telegram_bot.send_message
          data:
            chat_id: !secret telegram_chat_id
            parse_mode: plain_text
            message: |
              🤖 Suas automacoes

              Nenhuma automacao criada pelo agente ainda.
              Use /nova_automacao para criar uma.
        - stop: "Lista vazia"
    - variables:
        list_text: >
          {% set ns = namespace(lines=['🤖 Suas automacoes (' ~ total ~ ')', '']) %}
          {% for a in autos[:10] %}
          {% set ns.lines = ns.lines + [(loop.index | string) ~ '. ' ~ a.alias] %}
          {% endfor %}
          {% set ns.lines = ns.lines + ['', 'Toque em Remover N para excluir.'] %}
          {{ ns.lines | join('\n') }}
        kb_rows: >
          {% set ns = namespace(rows=[]) %}
          {% for a in autos[:10] %}
          {% set ns.rows = ns.rows + ['Remover ' ~ loop.index ~ ':/drmv_confirm_' ~ a.id] %}
          {% endfor %}
          {{ {"rows": ns.rows} | tojson }}
    - action: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_id
        parse_mode: plain_text
        message: "{{ list_text }}"
        inline_keyboard: "{{ (kb_rows | trim | from_json).rows }}"

# /nova_automacao command — initiates reactive automation-creation flow
- alias: "PERMEAR - New automation command"
  id: permear_new_automation_cmd
  trigger:
    - platform: event
      event_type: telegram_command
      event_data:
        command: "/nova_automacao"
        chat_id: !secret telegram_chat_id
  action:
    - action: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_id
        parse_mode: plain_text
        message: |
          Nova automacao

          Descreva o que ela deve fazer.
          Ex: "ligar AC suite as 18h se temperatura passar de 25 graus"
    - action: input_text.set_value
      target:
        entity_id: input_text.permear_pending_auto_spec
      data:
        value: "awaiting_new"
  mode: single
