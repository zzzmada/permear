# events.yaml — PERMEAR v8
# Event collection and direct-alert layer:
# - permear_event_buffer: 18 household event triggers (state/numeric_state)
# - permear_entity_sync: sync monitored entities at 09:00 (Wake cycle)
# - permear_aras_priority_alerts: direct alerts for priority=2 entities
#   (trigger block generated by generate_buffer_events.py between markers)

# Daily event buffer — captures household events for ARAS evaluation
- alias: "PERMEAR - Daily event buffer"
  id: permear_event_buffer
  trigger:
    # [BEGIN buffer_eventos triggers — generated]
    - platform: state
      entity_id: !secret permear_person_entity
      to: "home"
      id: "resident_arrived"
    - platform: state
      entity_id: !secret permear_person_entity
      from: "home"
      id: "resident_left"
    - platform: numeric_state
      entity_id: sensor.temperatura_movel_temperature
      above: 28
      id: "calor_suite_28"
    - platform: numeric_state
      entity_id: sensor.temperatura_movel_temperature
      below: 18
      id: "frio_suite_18"
    - platform: numeric_state
      entity_id: sensor.temperatura_movel_humidity
      above: 70
      id: "umidade_alta_70"
    - platform: state
      entity_id: binary_sensor.sensor_da_janela_da_sala_contact
      to: "on"
      for: "00:05:00"
      id: "janela_aberta_5min"
    - platform: state
      entity_id: climate.ar_suite
      to: "cool"
      id: "ac_suite_ligou"
    - platform: state
      entity_id: climate.ar_suite
      to: "off"
      id: "ac_suite_desligou"
    - platform: state
      entity_id: climate.ar_bedroom2
      to: "cool"
      id: "ac_bedroom2_on"
    - platform: state
      entity_id: input_boolean.ar_sala
      to: "on"
      id: "ac_sala_ligou"
    - platform: state
      entity_id: input_boolean.ar_sala
      to: "off"
      id: "ac_sala_desligou"
    - platform: numeric_state
      entity_id: sensor.sensor_mesa_sala_temperature
      above: 28
      id: "calor_sala_28"
    - platform: state
      entity_id: binary_sensor.sensor_da_janela_da_sala_contact
      to: "on"
      id: "janela_sala_aberta"
    - platform: state
      entity_id: binary_sensor.sensor_da_janela_da_sala_contact
      to: "off"
      id: "janela_sala_fechada"
    - platform: state
      entity_id: cover.cortina_da_direita
      id: "cortina_direita_mudou"
      for:
        seconds: 3
    - platform: state
      entity_id: cover.cortina_da_esquerda
      id: "cortina_esquerda_mudou"
    - platform: state
      entity_id: media_player.tv_da_sala
      to: "on"
      id: "tv_sala_ligou"
    - platform: state
      entity_id: media_player.tv_da_sala
      to: "off"
      id: "tv_sala_desligou"
    # [END buffer_eventos triggers — generated]
  action:
    - variables:
        metadata: |
          {% set ns = namespace(attrs={}) %}
          {% if trigger.to_state and trigger.to_state.domain == 'media_player' %}
            {% set ns.attrs = {'title': (trigger.to_state.attributes.media_title | default('') | string)} %}
          {% elif trigger.to_state and trigger.to_state.domain == 'cover' %}
            {% set ns.attrs = {'position': trigger.to_state.attributes.current_position | default(-1) | int} %}
          {% elif trigger.to_state and trigger.to_state.domain == 'climate' %}
            {% set ns.attrs = {'temp': (trigger.to_state.attributes.current_temperature | default(0) | float), 'setpoint': (trigger.to_state.attributes.temperature | default(0) | float)} %}
          {% endif %}
          {{ ns.attrs | to_json }}
    - action: shell_command.record_event
      data:
        detalhe: "{{ trigger.id }}"
        entity_id: "{{ trigger.entity_id | default('') }}"
        metadata: "{{ metadata | trim }}"
  mode: queued
  max: 20

# Wake cycle — sync monitored entities (09:00 daily) and ask priority for new sensitive ones
- alias: "PERMEAR - Sync monitored entities"
  id: permear_entity_sync
  trigger:
    - platform: time
      at: "09:00:00"
  action:
    - action: shell_command.discover_entities
      response_variable: discover_result

    - action: shell_command.cat_pending_priority
      response_variable: pending_raw
    - variables:
        pending_data: "{{ pending_raw.stdout | default('{}') | from_json | default({}, true) }}"
        pending_list: "{{ pending_data.entities | default([]) }}"
    - repeat:
        for_each: "{{ pending_list }}"
        sequence:
          - action: telegram_bot.send_message
            data:
              chat_id: !secret telegram_chat_id
              parse_mode: plain_text
              message: >
                Detectei um dispositivo novo sensível:
                {{ repeat.item.friendly_name }}
                ({{ repeat.item.entity_id }})

                Quão importante é para você ser avisado sobre este sensor?
              inline_keyboard:
                - "Sempre:/prio_set_2_{{ repeat.item.entity_id }}, Só se anormal:/prio_set_1_{{ repeat.item.entity_id }}"
                - "Ignorar:/prio_set_0_{{ repeat.item.entity_id }}"
  mode: single

# Direct alerts for priority=2 entities (event-driven, bypasses Heartbeat timing).
# Trigger block is generated by generate_buffer_events.py when any entity has priority=2.
# To populate: set priority=2 via Telegram card, then run:
#   python3 /config/scripts/generate_buffer_events.py
# and Reload Automations in HA.
- alias: "PERMEAR - ARAS priority=2 alerts"
  id: permear_aras_priority_alerts
  mode: queued
  max: 5
  trigger:
    # [BEGIN aras_priority triggers — generated]
    # [END aras_priority triggers — generated]
    - platform: event
      event_type: permear_aras_priority_placeholder
  action:
    - action: shell_command.aras_evaluate_one
      data:
        content: "{{ trigger.id | default(trigger.event.event_type) }}"
        entity_id: "{{ trigger.entity_id | default('') }}"
      response_variable: aras_result
    - variables:
        aras: "{{ aras_result.stdout | default('{}') | from_json | default({}, true) }}"
    - condition: template
      value_template: "{{ aras.decision | default('suppress') != 'suppress' }}"
    - action: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_id
        parse_mode: plain_text
        message: "{{ aras.content | default('') }}"
    - action: shell_command.record_interaction
      data:
        canal: aras_emit
        content: "{{ aras.content | default('') | truncate(80, False, '') }}"
      continue_on_error: true
