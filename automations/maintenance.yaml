# maintenance.yaml — PERMEAR v8
# PERMEAR-core housekeeping automations.

# Cleanup archived errors (every 6 hours)
- alias: "Maintenance - Cleanup archived errors"
  id: permear_maintenance_cleanup_archived
  trigger:
    - platform: time_pattern
      hours: "/6"
  action:
    - service: shell_command.cleanup_archived_errors
  mode: single

# SD4: clean event_buffer rows from previous days (daily 00:05)
- alias: "Maintenance - Cleanup event buffer"
  id: permear_maintenance_cleanup_event_buffer
  trigger:
    - platform: time
      at: "00:05:00"
  action:
    - service: shell_command.cleanup_event_buffer
      continue_on_error: true
  mode: single
