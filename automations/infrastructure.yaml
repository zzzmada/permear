# infrastructure.yaml — PERMEAR v8
# System infrastructure automations (housekeeping, startup, error monitor):
# - clear old logs
# - real-time error monitor (direct Telegram, bypasses ARAS)
# - ensure memory DB exists at startup

- alias: "PERMEAR - Clear old logs"
  id: permear_clear_old_logs
  trigger:
    - platform: time
      at: "00:10:00"
  action:
    - action: shell_command.clear_old_logs
  mode: single

# Real-time error monitor with Telegram card + Silence button.
# Errors bypass ARAS by design (NOISY filter in process_log_event.py).
- alias: "PERMEAR - Real-time error monitor"
  id: permear_error_monitor
  mode: queued
  max: 5
  trigger:
    - platform: event
      event_type: system_log_event
      event_data:
        level: ERROR
  action:
    - action: shell_command.process_log_event
      data:
        component: "{{ trigger.event.data.name | default('unknown') }}"
        message: "{{ trigger.event.data.message | default('') | truncate(200, False, '') }}"
      response_variable: log_result
    - variables:
        parsed: "{{ log_result.stdout | default('{}') | from_json | default({'silenced': true}) }}"
    - condition: template
      value_template: "{{ not parsed.silenced }}"
    - action: telegram_bot.send_message
      data:
        chat_id: !secret telegram_chat_id
        message: "{{ parsed.message }}\n[id:{{ parsed.hash }}]"
        parse_mode: plain_text
        inline_keyboard:
          - "Silenciar 24h:/Silenciar"
    - action: shell_command.record_event
      data:
        detalhe: "error:{{ trigger.event.data.name | default('?') }}:{{ trigger.event.data.message | default('') | truncate(50, False, '') }}"
    - delay:
        minutes: 10

# Ensures memory DB exists at startup (init_db is idempotent).
- alias: "PERMEAR - Initialize memory DB on startup"
  id: permear_init_memory_db
  trigger:
    - platform: homeassistant
      event: start
  action:
    - action: shell_command.init_memory_db
      continue_on_error: true
  mode: single
