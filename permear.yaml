# permear.yaml — PERMEAR system configuration
#
# This is the only file you need to edit to configure PERMEAR.
# Set your AI providers below, then reload HA.
#
# To find your provider entity_ids: Developer Tools → States, search for
# "conversation." or "ai_task." after adding your AI integration.
#
# See docs/providers.md for per-provider setup instructions.
# See docs/configuration.md for full reference.

providers:
  # -------------------------------------------------------------------------
  # conversation — interactive agent (Telegram, voice).
  # Must support tools/function-calling.
  # -------------------------------------------------------------------------
  # Examples:
  #   conversation.google_ai_conversation    (Gemini — free tier available)
  #   conversation.openai_conversation       (OpenAI or OpenRouter)
  #   conversation.anthropic_conversation    (Claude)
  conversation: conversation.google_ai_conversation

  # -------------------------------------------------------------------------
  # data — non-interactive engine (cycles, memory, judgment).
  # Does NOT need tools. Handles ai_task.generate_data calls.
  # -------------------------------------------------------------------------
  # Examples:
  #   ai_task.google_ai_task                (Gemini)
  #   ai_task.deepseek_deepseek_v4_flash    (DeepSeek — no daily quota)
  #   ai_task.openai_ai_task               (OpenAI)
  data: ai_task.deepseek_deepseek_v4_flash

  # -------------------------------------------------------------------------
  # conversation_fallback — takes over if conversation fails 3 consecutive
  # times. Must ALSO support tools. If equal to conversation, acts as retry.
  # Reading B: if this also fails, user gets an honest error — no degraded mode.
  # -------------------------------------------------------------------------
  conversation_fallback: conversation.deepseek_deepseek_v4_flash

  # -------------------------------------------------------------------------
  # data_fallback — takes over if data fails.
  # If equal to data, acts as retry.
  # -------------------------------------------------------------------------
  data_fallback: ai_task.google_ai_task

# =============================================================================
# ARAS Filter — salience sensitivity
# =============================================================================
#
# PERMEAR uses a neurologically-inspired filter (ARAS) to decide which household
# events deserve your attention and which should be suppressed. The system is
# self-regulating: it starts curious and grows selective as it learns your home.
#
# This single parameter controls where on that spectrum PERMEAR operates.
# Everything else is fixed — you do not need to tune any other threshold.
#
# Options:
#
#   sensitive  — More alerts. Good for new installs (you want to see what
#                PERMEAR notices) or households with many monitored devices.
#                The system emits more and suppresses less.
#
#   balanced   — Default. Calibrated on a real household over several months.
#                Start here. Most users will never need to change this.
#
#   quiet      — Fewer alerts. Good for mature installs where PERMEAR already
#                knows your home well, or if you prefer minimal interruptions.
#                The system is more selective and only surfaces significant events.
#
# You can change this at any time and reload HA — no data loss, no restart needed.
#
agent:
  # The key used to look up the primary resident in guidelines.json → residents.
  # Must match the "name" field of the first resident in your guidelines.json.
  # Used in ARAS gray-zone prompts and Sleep Consolidation context.
  primary_resident: ""   # ← set this to your name (e.g. "Maria")

aras:
  sensitivity: balanced

# =============================================================================
# Cycle schedules
# =============================================================================
#
# When do PERMEAR's three cycles run?
#
# After changing any time here: save the file and reload HA
# (Dev Tools → YAML → Reload All). The new schedule takes effect immediately.
# No restart needed.
#
cycles:

  # ---------------------------------------------------------------------------
  # Heartbeat — the hourly attentional cycle
  # ---------------------------------------------------------------------------
  # Runs every hour within this window. Outside this window, PERMEAR is silent.
  # Set start after you wake up and end before you sleep.
  #
  # Note: the hourly frequency itself is fixed — HA does not allow dynamic
  # trigger intervals. To change frequency (e.g., every 2h), edit the
  # time_pattern trigger in automations/cycles.yaml directly.
  #
  heartbeat_start: "08:30"   # first Heartbeat of the day  (HH:MM)
  heartbeat_end:   "20:00"   # Heartbeat window closes at  (HH:MM)

  # ---------------------------------------------------------------------------
  # Sleep Consolidation — daily memory extraction
  # ---------------------------------------------------------------------------
  # Runs once per day at this time. Extracts memories from the day's events,
  # runs tier maintenance (tiers breathe, patterns emerge), and sends your
  # daily summary to Telegram.
  # Recommended: 30–60 minutes before you typically go to sleep.
  #
  sleep_time: "23:30"        # (HH:MM)

  # ---------------------------------------------------------------------------
  # Systems Consolidation — weekly compile (always on Sunday)
  # ---------------------------------------------------------------------------
  # Runs once per week on Sunday at this time. Analyzes the week, updates
  # action_items in guidelines.json, and suggests automations.
  # Recommended: early morning when the household is quiet.
  # The weekday (Sunday) is fixed. To change it, edit the condition in
  # automations/cycles.yaml directly.
  #
  systems_time: "04:00"      # Sunday only  (HH:MM)
