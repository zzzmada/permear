# PERMEAR Health Card — paste into your Lovelace dashboard (Raw configuration editor)
#
# Shows the current state of sensor.permear_health with state-conditional cards
# and an entities card listing key attributes.

type: vertical-stack
cards:
  - type: conditional
    conditions:
      - entity: sensor.permear_health
        state: all_ok
    card:
      type: markdown
      content: |
        ## 🟢 PERMEAR — All systems operational
        Primary provider stable.

  - type: conditional
    conditions:
      - entity: sensor.permear_health
        state: recovering
    card:
      type: markdown
      content: |
        ## 🟡 PERMEAR — Recovering
        {{ state_attr('sensor.permear_health', 'summary') }}

  - type: conditional
    conditions:
      - entity: sensor.permear_health
        state: fallback_active
    card:
      type: markdown
      content: |
        ## 🟠 PERMEAR — Fallback active
        {{ state_attr('sensor.permear_health', 'summary') }}

        Secondary provider in use today.

  - type: conditional
    conditions:
      - entity: sensor.permear_health
        state: degraded
    card:
      type: markdown
      content: |
        ## 🔴 PERMEAR — Degraded
        {{ state_attr('sensor.permear_health', 'summary') }}

        Circuit breaker open — waiting cooldown.

  - type: entities
    title: Details
    state_color: false
    show_header_toggle: false
    entities:
      - type: attribute
        entity: sensor.permear_health
        attribute: final_failures_today
        name: Final failures today
        icon: mdi:alert-circle-outline
      - type: attribute
        entity: sensor.permear_health
        attribute: fallbacks_secondary_today
        name: Fallbacks to secondary today
        icon: mdi:swap-horizontal
      - type: attribute
        entity: sensor.permear_health
        attribute: retries_recovered_today
        name: Retries recovered today
        icon: mdi:restart
      - type: attribute
        entity: sensor.permear_health
        attribute: last_fallback_at
        name: Last fallback
        icon: mdi:clock-outline
      - type: attribute
        entity: sensor.permear_health
        attribute: circuit_status
        name: Circuit breaker
        icon: mdi:electric-switch
